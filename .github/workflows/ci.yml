name: Terraform quality

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: terraform-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Validate ${{ matrix.stack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [aws, observability]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      - name: Check formatting
        run: terraform -chdir=${{ matrix.stack }} fmt -check -recursive

      - name: Initialize without backend
        run: terraform -chdir=${{ matrix.stack }} init -backend=false -input=false

      - name: Validate configuration
        run: terraform -chdir=${{ matrix.stack }} validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: Run TFLint
        run: |
          tflint --init --config="${GITHUB_WORKSPACE}/.tflint.hcl" || true
          tflint --chdir=${{ matrix.stack }} --config="${GITHUB_WORKSPACE}/.tflint.hcl" --format=compact || true
        env:
          GITHUB_TOKEN: ${{ github.token }}
