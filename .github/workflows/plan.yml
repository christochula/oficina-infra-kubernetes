name: Terraform plan

on:
  pull_request:
    branches: [main, homolog]

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan ${{ github.base_ref == 'main' && 'production' || 'homolog' }}
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ${{ github.base_ref == 'main' && 'production' || 'homolog' }}
    runs-on: ${{ vars.TF_RUNNER || 'ubuntu-latest' }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
      TF_AWS_STATE_KEY: ${{ vars.TF_AWS_STATE_KEY }}
      TF_PLATFORM_STATE_KEY: ${{ vars.TF_PLATFORM_STATE_KEY }}
      TF_OBSERVABILITY_STATE_KEY: ${{ vars.TF_OBSERVABILITY_STATE_KEY }}
      TF_VAR_environment: ${{ github.base_ref == 'main' && 'production' || 'homolog' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_vpc_cidr: ${{ vars.VPC_CIDR }}
      TF_VAR_az_count: ${{ github.base_ref == 'main' && '3' || '2' }}
      TF_VAR_nat_gateway_mode: ${{ github.base_ref == 'main' && 'per_az' || 'single' }}
      TF_VAR_cluster_endpoint_public_access: ${{ vars.CLUSTER_ENDPOINT_PUBLIC_ACCESS || 'false' }}
      TF_VAR_cluster_endpoint_public_access_cidrs: ${{ vars.CLUSTER_ENDPOINT_PUBLIC_ACCESS_CIDRS_JSON || '[]' }}
      TF_VAR_managed_node_groups: ${{ vars.MANAGED_NODE_GROUPS_JSON }}
      TF_VAR_alb_deletion_protection: ${{ github.base_ref == 'main' && 'true' || 'false' }}
      TF_VAR_cluster_deletion_protection: ${{ github.base_ref == 'main' && 'true' || 'false' }}
      TF_VAR_ecr_image_tag_mutability: ${{ github.base_ref == 'main' && 'IMMUTABLE' || 'MUTABLE' }}
      TF_VAR_aws_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_aws_state_key: ${{ vars.TF_AWS_STATE_KEY }}
      TF_VAR_aws_state_region: ${{ vars.TF_STATE_REGION }}
      TF_VAR_database_secret_arn: ${{ vars.DATABASE_SECRET_ARN }}
      TF_VAR_jwt_secret_arn: ${{ vars.JWT_SECRET_ARN }}
      TF_VAR_datadog_secret_arn: ${{ vars.DATADOG_SECRET_ARN }}
      TF_VAR_notification_queue_arn: ${{ vars.NOTIFICATION_QUEUE_ARN }}
      TF_VAR_external_secrets_kms_key_arns: ${{ vars.EXTERNAL_SECRETS_KMS_KEY_ARNS_JSON || '[]' }}
      TF_VAR_datadog_site: ${{ vars.DATADOG_SITE || 'datadoghq.com' }}
      TF_VAR_enable_aws_integration: ${{ vars.ENABLE_AWS_INTEGRATION || 'false' }}
      TF_VAR_aws_integration_role_name: ${{ vars.AWS_INTEGRATION_ROLE_NAME || 'DatadogIntegrationRole' }}
      TF_VAR_aws_integration_namespaces: ${{ vars.AWS_INTEGRATION_NAMESPACES_JSON || '["AWS/ApiGateway","AWS/Lambda","AWS/RDS"]' }}
      TF_VAR_manage_metric_tag_configuration: ${{ vars.MANAGE_DATADOG_METRIC_TAGS || 'false' }}
      TF_VAR_kubernetes_cluster_name: ${{ vars.KUBERNETES_CLUSTER_NAME }}
      TF_VAR_api_base_url: ${{ vars.API_BASE_URL }}
      TF_VAR_synthetics_locations: ${{ vars.SYNTHETICS_LOCATIONS_JSON }}
      TF_VAR_datadog_api_url: ${{ vars.DATADOG_API_URL || 'https://api.datadoghq.com/' }}
      DD_SECRET_ARN: ${{ vars.DATADOG_SECRET_ARN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-plan-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0

      - name: Plan AWS foundation
        working-directory: aws
        shell: bash
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_AWS_STATE_KEY}" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform plan -input=false -lock-timeout=5m

      - name: Plan platform controllers
        if: vars.ENABLE_PLATFORM == 'true'
        working-directory: platform
        shell: bash
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_PLATFORM_STATE_KEY}" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform plan -input=false -lock-timeout=5m

      - name: Load Datadog provider credentials from Secrets Manager
        if: vars.ENABLE_OBSERVABILITY == 'true'
        shell: bash
        run: |
          secret_json="$(aws secretsmanager get-secret-value --secret-id "${DD_SECRET_ARN}" --query SecretString --output text)"
          dd_api_key="$(jq -er '.api_key' <<<"${secret_json}")"
          dd_app_key="$(jq -er '.app_key' <<<"${secret_json}")"
          echo "::add-mask::${dd_api_key}"
          echo "::add-mask::${dd_app_key}"
          echo "DD_API_KEY=${dd_api_key}" >> "${GITHUB_ENV}"
          echo "DD_APP_KEY=${dd_app_key}" >> "${GITHUB_ENV}"

      - name: Plan Datadog resources
        if: vars.ENABLE_OBSERVABILITY == 'true'
        working-directory: observability
        shell: bash
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_OBSERVABILITY_STATE_KEY}" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform plan -input=false -lock-timeout=5m
