name: Terraform plan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1
  TF_VAR_aws_region: us-east-1
  TF_VAR_environment: homolog

jobs:
  plan:
    name: Plan aws
    # Nao roda para PRs vindos de fork (nao teriam acesso aos secrets).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (AWS Academy session keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0

      - name: Resolve state backend
        id: backend
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "bucket=oficina-tc3-tfstate-${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - name: Terraform plan (aws)
        working-directory: aws
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="key=oficina/kubernetes/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform plan -input=false -lock-timeout=5m -no-color -var 'datadog_enabled=false'
