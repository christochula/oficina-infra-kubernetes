name: Terraform deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-deploy-main
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1
  TF_VAR_aws_region: us-east-1
  TF_VAR_environment: homolog

jobs:
  apply:
    name: Apply infra (aws + observability)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (AWS Academy session keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      - name: Ensure Terraform state bucket
        id: backend
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          BUCKET="oficina-tc3-tfstate-${ACCOUNT_ID}"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region "${AWS_REGION}"
            aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"

      - name: Load Datadog keys from Secrets Manager
        id: dd
        run: |
          set -euo pipefail
          if [ "${{ vars.DATADOG_ENABLED }}" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          SECRET_ID="${{ vars.DATADOG_SECRET_ID || 'oficina/datadog' }}"
          JSON="$(aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --query SecretString --output text)"
          API="$(jq -er '.api_key' <<<"$JSON")"
          APP="$(jq -er '.app_key' <<<"$JSON")"
          echo "::add-mask::$API"; echo "::add-mask::$APP"
          {
            echo "TF_VAR_datadog_api_key=$API"
            echo "TF_VAR_datadog_app_key=$APP"
            echo "DD_API_KEY=$API"
            echo "DD_APP_KEY=$APP"
          } >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Terraform apply (aws)
        working-directory: aws
        env:
          TF_VAR_datadog_enabled: ${{ steps.dd.outputs.enabled }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="key=oficina/kubernetes/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform apply -input=false -lock-timeout=5m -auto-approve

      - name: Terraform outputs (aws)
        working-directory: aws
        run: terraform output

      - name: Terraform apply (observability)
        if: steps.dd.outputs.enabled == 'true'
        working-directory: observability
        run: |
          set -euo pipefail
          CLUSTER="$(terraform -chdir=../aws output -raw cluster_name)"
          terraform init -input=false \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="key=oficina/observability/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform apply -input=false -lock-timeout=5m -auto-approve \
            -var "kubernetes_cluster_name=${CLUSTER}" \
            -var "api_base_url=${{ vars.API_BASE_URL || 'http://api.placeholder.local' }}" \
            -var "datadog_api_url=${{ vars.DATADOG_API_URL || 'https://api.datadoghq.com/' }}"
