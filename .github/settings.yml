repository:
  name: oficina-infra-kubernetes
  description: Terraform AWS/EKS, platform controllers and Datadog observability for Oficina
  homepage: ""
  topics: terraform, aws, eks, kubernetes, datadog, external-secrets, fiap
  private: false
  has_issues: true
  has_projects: false
  has_wiki: false
  has_downloads: false
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: true
  allow_auto_merge: true
  delete_branch_on_merge: true
  enable_vulnerability_alerts: true
  enable_automated_security_fixes: true

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
      required_status_checks:
        strict: true
        contexts:
          - "Terraform quality / Validate aws"
          - "Terraform quality / Validate platform"
          - "Terraform quality / Validate observability"
          - "Terraform quality / Checkov"
      enforce_admins: true
      required_linear_history: true
      restrictions: null
  - name: homolog
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
      required_status_checks:
        strict: true
        contexts:
          - "Terraform quality / Validate aws"
          - "Terraform quality / Validate platform"
          - "Terraform quality / Validate observability"
          - "Terraform quality / Checkov"
      enforce_admins: false
      required_linear_history: true
      restrictions: null
